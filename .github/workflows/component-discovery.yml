name: Discover upstream component updates
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/component-discovery.yml'
      - 'scripts/discoverComponentUpdates.py'
      - 'include/component-sources.json'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/discoverComponentUpdates.py
            include/component-sources.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/discoverComponentUpdates.py --output component-discovery.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: Upstream-update-candidates
          path: component-discovery.json
          retention-days: 30
