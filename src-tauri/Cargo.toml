[package]
name = "vapourkit"
version = "0.14.1"
description = "Advanced GUI for VapourSynth and Video Upscaling"
authors = ["Kim2091"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vapourkit_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
toml = "0.8"
anyhow = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

# Pure-Rust 7-zip extraction
sevenz-rust = { version = "0.6", features = [] }
# Zip file extraction
zip = { version = "2", features = [] }
# URL decoding for custom protocol
urlencoding = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
